<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾集 · 授权结果</title><style>body{background:#f7f6fc;font-family:system-ui,sans-serif;color:#302441;padding:10vh 20px;text-align:center}.card{max-width:560px;margin:auto;background:white;border-radius:20px;padding:32px;box-shadow:0 12px 35px #33215317}a{color:#654ac5}p{line-height:1.7}</style></head><body><div class="card"><h1>拾集 SHIJI</h1><h2 id="headline">正在检查授权结果</h2><p id="message">请不要在地址栏分享包含授权码的链接。</p><a href="../../">返回拾集首页</a></div><script>
(function(){const params=new URLSearchParams(location.search),provider=params.get('provider'),code=params.get('code'),state=params.get('state'),error=params.get('error');const headline=document.getElementById('headline'),msg=document.getElementById('message');const base=new URL('../../',location.href);let result={provider:provider||'unknown',status:'not_configured',at:Date.now()};if(error){result.status='denied';headline.textContent='授权未完成';msg.textContent='平台返回：'+error}else if(!code||!state){result.status='invalid';headline.textContent='无法确认授权';msg.textContent='缺少授权码或防伪参数。请返回拾集重新操作。'}else{headline.textContent='收到授权回调，但尚未绑定';msg.textContent='由于该平台应用的服务端凭据及 OAuth 授权流程尚未配置，拾集没有交换授权码，也不会标记已连接。请联系拾集管理员完成官方应用接入。'}history.replaceState(null,'',location.pathname);setTimeout(()=>{const link=document.querySelector('a');link.href=base.href},0)})();
</script></body></html>
