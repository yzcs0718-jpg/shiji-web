name: Spark product E2E tests
on:
  push:
    branches: [main]
    paths:
      - "spark/**"
      - "tests/spark.spec.cjs"
      - ".github/workflows/spark-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spark-http.log 2>&1 &
          npx playwright test tests/spark.spec.cjs --reporter=line
      - name: Upload test screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spark-test-results
          path: test-results/
          if-no-files-found: ignore
