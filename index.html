<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7253ce"><title>拾集 SHIJI · 灵感收藏库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6fc;color:#29243a;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#6445bb}aside{background:white;border-right:1px solid #e8e3f1;width:238px;position:fixed;top:0;bottom:0;padding:30px 18px}.logo{font-size:30px;color:#7052c7;font-weight:800}.sub{color:#898197;font-size:13px}.nav{margin-top:35px;display:grid;gap:8px}.nav button{background:transparent;border:0;text-align:left;border-radius:12px;padding:13px;color:#5b5270}.nav button.sel{background:#eee8fd;color:#6948c7;font-weight:bold}main{margin-left:238px;padding:36px 40px;max-width:1440px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;letter-spacing:2px;color:#897e9b}h1{margin:12px 0;font-size:30px}h2{margin:0 0 10px;font-size:21px}.hero{margin:24px 0;padding:30px;background:linear-gradient(100deg,#eae2fd,#fcf9ff);border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.btn{background:#7454c9;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}.outline{background:white;border:1px solid #ddd4ed;color:#5c44a1}.sm{padding:8px 12px;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,textarea{padding:10px 12px;border-radius:10px;border:1px solid #ded8e8;background:#fff;min-width:0}.search{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.item{background:white;border:1px solid #ebe7f2;border-radius:16px;padding:18px;min-height:155px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}.item>a{font-weight:650;text-decoration:none;color:#392c59}.item footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12px;color:#8a809c}.pill{background:#f0ebfa;border-radius:99px;padding:4px 8px;color:#634ca1}.empty{text-align:center;padding:55px 18px;color:#978ba7}.modal{position:fixed;inset:0;background:#241a3b8c;display:none;align-items:center;justify-content:center;padding:15px;z-index:4}.modal.show{display:flex}.dialog{background:white;padding:25px;border-radius:20px;width:min(530px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:12px}.form label{display:grid;gap:5px}.form input,.form textarea,.form select{width:100%}.notice{padding:12px;background:#f0eafa;border-radius:10px;color:#5c4b83;font-size:13px}.error{background:#fff2f2;color:#9d3030}.status{margin:15px 0;padding:12px;border-radius:10px;background:#eeebf9}.hidden{display:none!important}.right{display:flex;align-items:center;gap:10px}.check{display:flex;gap:7px;align-items:center}.check input{accent-color:#7454c9}#account{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:740px){aside{position:static;width:auto;padding:15px 18px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}main{margin:0;padding:20px 16px}header,.hero{flex-wrap:wrap}.hero{padding:21px}h1{font-size:26px}}
</style></head>
<body><aside><div class="logo">拾集 <span style="font-size:12px;font-weight:400">SHIJI</span></div><p class="sub">好内容，值得被再次找到。</p><div class="nav" id="nav"><button class="sel" data-p="all">✦ 全部收藏</button><button data-p="xhs">◉ 小红书</button><button data-p="douyin">♫ 抖音</button><button data-p="bili">▣ B站</button><button data-p="other">◇ 其他</button></div></aside>
<main><header><div><div class="eyebrow">COLLECT WITH INTENTION</div><h1>你的收藏，都在这里。</h1><div class="sub" id="count"></div></div><div class="right"><span class="sub" id="account">访客本地模式</span><button class="btn outline sm" id="auth">登录 / 注册</button></div></header>
<section class="hero"><div><h2>把灵感收好，再慢慢发现。</h2><div class="sub">随时保存链接、整理灵感。登录后可在不同设备查看。</div></div><button class="btn" id="add">＋ 添加收藏</button></section><div id="status" class="status hidden" role="status"></div>
<div class="toolbar"><input class="search" id="q" placeholder="跨平台搜索：关键词、主题、标题、链接"><select id="cat"><option value="">全部分类</option></select><button class="btn sm" id="paste">粘贴批量收藏</button><button class="btn outline sm" id="import">批量导入 JSON</button><button class="btn outline sm" id="autocat">规则分类</button><button class="btn sm" id="aiCat">✨ AI智能分类</button><button class="btn outline sm" id="connect">平台连接状态</button><button class="btn outline sm" id="export">导出备份</button><button class="btn outline sm" id="reload">刷新</button></div>
<div class="toolbar"><label class="check"><input type="checkbox" id="all">全选当前结果</label><span class="sub" id="selected"></span><button class="btn outline sm" id="move">批量分类</button><button class="btn outline sm" id="remove">删除所选</button></div><div class="grid" id="grid"></div><div id="empty" class="empty">还没有收藏，点击「添加收藏」开始。</div><input id="file" type="file" accept=".json,application/json" class="hidden">
</main><div class="modal" id="modal"><div class="dialog"><div class="right" style="justify-content:space-between"><h2 id="mtitle"></h2><button class="btn outline sm" id="close">关闭</button></div><div id="mbody"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), conf=window.SHIJI_CONFIG||{}, valid=Boolean(conf.url&&conf.publishableKey&&!/YOUR_|example/i.test(conf.url+conf.publishableKey));
const sb=valid&&window.supabase?window.supabase.createClient(conf.url,conf.publishableKey):null;
let user=null, rows=[], platform='all', chosen=new Set(), busy=false;
const key='shiji_guest_v1',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=(m,err=false)=>{$('status').textContent=m;$('status').className='status'+(err?' error':'');};
const getLocal=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};
const saveLocal=()=>localStorage.setItem(key,JSON.stringify(rows));
const normalize=u=>{let x=new URL(String(u).trim());if(!['http:','https:'].includes(x.protocol))throw Error('仅支持 http / https 链接');x.hash='';x.hostname=x.hostname.toLowerCase();for(const k of [...x.searchParams.keys()])if(/^(utm_|spm|share_|fbclid|gclid|timestamp|source)/i.test(k))x.searchParams.delete(k);return x.href};
const platformOf=u=>{try{const h=new URL(u).hostname.toLowerCase();const m=d=>h===d||h.endsWith('.'+d);return m('xiaohongshu.com')||m('xhslink.com')?'xhs':m('douyin.com')||m('iesdouyin.com')?'douyin':m('bilibili.com')||m('b23.tv')?'bili':'other'}catch{return 'other'}};
const CATEGORY_RULES = [{"name":"学习教育","terms":["学习","教程","考研","英语","课程","复习","数学","programming","tutorial","study","教学","知识"]},{"name":"美食烹饪","terms":["食谱","做饭","烘焙","菜谱","美食","厨房","火锅","cooking","recipe","food"]},{"name":"旅行攻略","terms":["旅行","旅游","出游","酒店","景点","攻略","航班","travel","trip"]},{"name":"健身运动","terms":["健身","运动","减脂","增肌","跑步","训练","workout","fitness","yoga"]},{"name":"摄影设计","terms":["摄影","拍照","剪辑","设计","排版","ps","修图","配色","camera","photo","video","design"]},{"name":"科技数码","terms":["AI","人工智能","数码","手机","编程","软件","开发","电脑","数字","technology","gadget"]},{"name":"穿搭美妆","terms":["穿搭","衣服","护肤","化妆","彩妆","口红","outfit","makeup","fashion"]},{"name":"生活家居","terms":["家居","收纳","装修","清洁","生活","房间","house","home"]},{"name":"娱乐影视","terms":["电影","电视剧","动漫","游戏","搞笑","音乐","综艺","movie","music","gaming"]},{"name":"商业职场","terms":["营销","运营","电商","亚马逊","工作","面试","简历","职场","marketing","business"]}];
const suggestedCategory=(text)=>{const str=String(text||'').toLowerCase();let best='待整理',score=0;for(const rule of CATEGORY_RULES){const n=rule.terms.reduce((sum,term)=>sum+(str.includes(term.toLowerCase())?1:0),0);if(n>score){score=n;best=rule.name}}return best};
const searchText=(r)=>{const cat=r.category||'',rule=CATEGORY_RULES.find(x=>x.name===cat);return [r.title,r.url,cat,rule?rule.terms.join(' '):''].join(' ').toLowerCase()};
const visible=()=>rows.filter(r=>(platform==='all'||r.platform===platform)&&(!$('cat').value||r.category===$('cat').value)&&searchText(r).includes($('q').value.toLowerCase()));
const persist=async()=>{if(!user){saveLocal();return}throw Error('请使用云端写入方法')};
const getRows=async()=>{if(!user){rows=getLocal();render();return}if(!sb)throw Error('云端服务未配置');let all=[],from=0;while(true){const {data,error}=await sb.from('bookmarks').select('id,title,url,platform,category,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).range(from,from+499);if(error)throw error;all.push(...data);if(data.length<500)break;from+=500}rows=all;render()};
const addOne=async obj=>{const url=normalize(obj.url),title=(obj.title||url).trim(),category=(obj.category||suggestedCategory(title)).trim(),p=platformOf(url);if(rows.some(r=>normalize(r.url)===url))return false;
if(user){const {error}=await sb.from('bookmarks').insert({user_id:user.id,url,title,category,platform:p});if(error){if(error.code==='23505')return false;throw error}}else{rows.unshift({id:crypto.randomUUID(),title,url,category,platform:p,created_at:new Date().toISOString()});saveLocal()}return true};
const render=()=>{const all=visible();$('count').textContent=rows.length+' 条收藏';$('selected').textContent='已选 '+chosen.size+' 条';$('empty').classList.toggle('hidden',all.length>0);$('grid').innerHTML=all.map(r=>'<article class="item"><label class="check"><input type="checkbox" data-id="'+esc(r.id)+'" '+(chosen.has(String(r.id))?'checked':'')+'> <span class="sub">'+esc(({xhs:'小红书',douyin:'抖音',bili:'B站',other:'其他'})[r.platform]||'其他')+'</span></label><a target="_blank" rel="noopener noreferrer" href="'+esc(r.url)+'">'+esc(r.title)+'</a><div class="sub">'+esc(r.url)+'</div><footer><span class="pill">'+esc(r.category||'未分类')+'</span><span>'+esc(String(r.created_at||'').slice(0,10))+'</span></footer></article>').join('');const cats=[...new Set(rows.map(r=>r.category||'未分类'))].sort();let current=$('cat').value;$('cat').innerHTML='<option value="">全部分类</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('cat').value=cats.includes(current)?current:'';$('all').checked=all.length>0&&all.every(r=>chosen.has(String(r.id)));};
const modal=(title,html)=>{$('mtitle').textContent=title;$('mbody').innerHTML=html;$('modal').classList.add('show')};
$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};
$('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(!b)return;platform=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('sel',x===b));chosen.clear();render()};
$('q').oninput=render;$('cat').onchange=render;
$('grid').onchange=e=>{if(e.target.matches('[data-id]')){e.target.checked?chosen.add(e.target.dataset.id):chosen.delete(e.target.dataset.id);render()}};
$('all').onchange=e=>{visible().forEach(r=>e.target.checked?chosen.add(String(r.id)):chosen.delete(String(r.id)));render()};
$('add').onclick=()=>{modal('添加收藏','<form class="form" id="addForm"><label>收藏链接<input name="url" type="url" required placeholder="https://..."></label><label>标题<input name="title" maxlength="200" placeholder="给这条收藏起个名字"></label><label>分类<input name="category" maxlength="60" placeholder="留空即可自动归类"></label><button class="btn">保存收藏</button></form>');$('addForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const added=await addOne(Object.fromEntries(f));await getRows();$('close').click();notice(added?'收藏已保存':'这条收藏已经存在')}catch(err){notice(err.message,true)}}};
$('reload').onclick=async()=>{try{await getRows();notice('收藏已刷新')}catch(e){notice(e.message,true)}};
$('remove').onclick=async()=>{if(!chosen.size||!confirm('确认删除所选 '+chosen.size+' 条收藏？'))return;try{if(user){const {error}=await sb.from('bookmarks').delete().eq('user_id',user.id).in('id',[...chosen]);if(error)throw error}else{rows=rows.filter(x=>!chosen.has(String(x.id)));saveLocal()}chosen.clear();await getRows();notice('已删除')}catch(e){notice(e.message,true)}};
$('move').onclick=()=>{if(!chosen.size)return notice('请先选择收藏',true);modal('批量修改分类','<form class="form" id="moveForm"><label>新分类<input name="category" maxlength="60" required></label><button class="btn">确认分类</button></form>');$('moveForm').onsubmit=async e=>{e.preventDefault();const category=new FormData(e.target).get('category').trim();try{if(user){const {error}=await sb.from('bookmarks').update({category}).eq('user_id',user.id).in('id',[...chosen]);if(error)throw error}else{rows.forEach(r=>{if(chosen.has(String(r.id)))r.category=category});saveLocal()}chosen.clear();await getRows();$('close').click();notice('分类已更新')}catch(err){notice(err.message,true)}}};
$('aiCat').onclick=async()=>{if(!user)return notice('请先登录拾集账号，再使用云端 AI 分类',true);const targets=rows.filter(r=>!r.category||['未分类','待整理'].includes(r.category)).slice(0,12);if(!targets.length)return notice('没有待分类收藏；可先将需要重新分类的收藏批量设置为“待整理”');if(!confirm('将根据 '+targets.length+' 条收藏的标题调用 AI 分类（每次最多12条，不会分析视频画面），继续？'))return;const btn=$('aiCat');btn.disabled=true;btn.textContent='AI 分类中…';try{const {data:sessionData,error:sessionError}=await sb.auth.getSession();if(sessionError||!sessionData.session)throw Error('请重新登录');const response=await fetch(conf.url+'/functions/v1/shiji-ai-classify',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionData.session.access_token,'apikey':conf.publishableKey},body:JSON.stringify({items:targets.map(r=>({id:r.id,title:r.title,url:r.url}))})});const data=await response.json();if(!response.ok)throw Error(data.error||'AI 服务不可用');await getRows();notice('AI 已分类 '+data.updated+' 条；依据标题推断，请抽查准确性')}catch(err){notice(err.message+'。可改用“规则分类”。',true)}finally{btn.disabled=false;btn.textContent='✨ AI智能分类'}};
$('connect').onclick=()=>modal('登录我的平台账号','<p class="notice">下方是三个平台的真实官方网站入口。在官方页面完成登录，账号密码和 Cookie 不会进入拾集。浏览器会为不同用户分别保存对应平台的登录状态（取决于设备及浏览器的用户配置）。</p><div class="form"><div><b>抖音</b><p class="sub">在抖音官网登录自己的账号；官方页面可查看个人收藏（可用功能以平台实际提供为准）。</p><a target="_blank" rel="noopener noreferrer" href="https://www.douyin.com/">↗ 前往抖音官网登录</a></div><div><b>小红书</b><p class="sub">在小红书官网登录自己的账号。</p><a target="_blank" rel="noopener noreferrer" href="https://www.xiaohongshu.com/">↗ 前往小红书官网登录</a></div><div><b>B站</b><p class="sub">在B站官网登录自己的账号。</p><a target="_blank" rel="noopener noreferrer" href="https://www.bilibili.com/">↗ 前往B站官网登录</a></div></div><p class="notice"><b>连接状态：尚未连接拾集。</b> 从这里跳转并在官网成功登录，并不等于平台把账号身份或私人收藏授权给拾集。平台登录会话仍归平台自身管理。要实现自动导入，必须另行接入具备收藏读取权限的官方接口。</p>');
$('autocat').onclick=async()=>{const targets=rows.filter(r=>!r.category||r.category==='未分类'||r.category==='待整理');if(!targets.length)return notice('暂无需要分类的收藏');if(!confirm('对 '+targets.length+' 条未分类收藏，根据标题关键词智能分类？无法识别的保留为待整理。'))return;let done=0;try{for(const r of targets){const category=suggestedCategory(r.title);if(category==='待整理')continue;if(user){const {error}=await sb.from('bookmarks').update({category}).eq('user_id',user.id).eq('id',r.id);if(error)throw error}else{r.category=category}done++}if(!user)saveLocal();await getRows();notice('自动分类完成：'+done+' 条；仅依据标题关键词，建议人工抽查')}catch(e){notice('分类中断：'+e.message,true)}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(rows.map(({title,url,category})=>({title,url,category})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shiji-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const extractLinks=text=>{const found=new Map(),lines=String(text||'').split(/\n+/);for(const line of lines){const urls=[...line.matchAll(/https?:\/\/[^\s<>"'，,）)]+/g)];for(const match of urls){try{const url=normalize(match[0].replace(/[。；;！!?]+$/,''));if(platformOf(url)==='other')continue;let title=line.slice(0,match.index).replace(/(?:复制|打开|查看|分享|链接|口令|地址|视频|笔记|到|在|抖音|小红书|哔哩哔哩|b站)\s*[:：]?\s*$/ig,'').replace(/^[\s#【\[]+|[\s#】\]]+$/g,'').trim();title=title.replace(/^\d+[\s.、-]+/,'').slice(0,200);if(!title||title.length<3)title=url;const item={url,title,category:''};if(!found.has(url)||found.get(url).title===url)found.set(url,item)}catch{}}}return [...found.values()]};
$('paste').onclick=()=>{modal('批量导入视频收藏','<p class="notice">从抖音、小红书或B站复制分享链接，逐行粘贴。仅采集你主动粘贴的链接，不会读取平台账号或私人收藏。</p><form id="pasteForm" class="form"><label>收藏链接<textarea id="pasteText" rows="8" placeholder="在这里粘贴多个视频链接或分享文字…" required></textarea></label><p id="pasteInfo" class="sub">自动过滤重复链接，预览后再确认导入。</p><button type="button" class="btn outline" id="pastePreview">识别并预览</button><div id="pasteCandidates"></div></form>');
const box=$('pasteCandidates');$('pastePreview').onclick=()=>{const candidates=extractLinks($('pasteText').value).slice(0,300);const existing=new Set(rows.map(r=>{try{return normalize(r.url)}catch{return r.url}}));const unique=candidates.filter(c=>!existing.has(c.url));$('pasteInfo').textContent='识别到 '+candidates.length+' 条平台链接，其中 '+unique.length+' 条尚未保存。';if(!unique.length){box.innerHTML='<p class="notice">没有发现新的有效平台链接。</p>';return}box.innerHTML='<p class="sub">请勾选要导入的链接（每次最多300条）。保存后可以修改标题和自动分类。</p><div style="max-height:210px;overflow:auto">'+unique.map((c,i)=>'<label class="check" style="padding:6px 0"><input type="checkbox" data-paste="'+i+'" checked><span class="sub">'+esc(c.url)+'</span></label>').join('')+'</div><button class="btn" id="pasteConfirm" type="button">确认导入所选</button>';
$('pasteConfirm').onclick=async()=>{const chosenItems=[...box.querySelectorAll('[data-paste]:checked')].map(input=>unique[Number(input.dataset.paste)]);if(!chosenItems.length)return;$('pasteConfirm').disabled=true;let added=0,failed=0;for(const c of chosenItems){try{if(await addOne(c))added++}catch{failed++}}await getRows();$('close').click();notice('已导入 '+added+' 条'+(failed?'；失败 '+failed+' 条，请检查链接或云端权限':''))}}};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming))throw Error('JSON 须为收藏对象数组');if(incoming.length>3000)throw Error('一次最多导入 3000 条');let candidates=incoming.filter(x=>x&&typeof x.url==='string').map(x=>({title:String(x.title||x.url).slice(0,200),url:x.url,category:String(x.category||'').slice(0,60)}));if(!confirm('找到 '+candidates.length+' 条候选收藏，确认导入并自动去重？'))return;let added=0;for(let c of candidates){try{if(await addOne(c))added++}catch(err){console.warn(err)}}await getRows();notice('导入完成：新增 '+added+' 条，其他为重复或不合法链接')}catch(err){notice(err.message,true)}finally{e.target.value=''}};
const showPasswordUpdate=()=>{modal('设置新密码','<form class="form" id="changePwd"><p class="notice">已验证重置链接，请设置新密码。</p><label>新密码<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>确认新密码<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label><p id="changeMsg" role="status" aria-live="polite"></p><button class="btn" type="submit">保存新密码</button></form>');
$('changePwd').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,pass=form.elements.password.value,confirmPass=form.elements.confirm.value,msg=$('changeMsg');if(pass.length<8||pass!==confirmPass){msg.textContent='两次密码必须一致，且不少于 8 位';return}const btn=form.querySelector('button');btn.disabled=true;try{const {error}=await sb.auth.updateUser({password:pass});if(error)throw error;msg.textContent='密码修改成功，请使用新密码登录。';await sb.auth.signOut();setTimeout(()=>{$('close').click()},1300)}catch(err){msg.textContent=err.message||'修改失败'}finally{btn.disabled=false}}};
$('auth').onclick=()=>{if(user){modal('账户','<p>当前账户：'+esc(user.email)+'</p><p id="authFeedback" role="status"></p><button class="btn" id="signout">退出登录</button>');$('signout').onclick=async()=>{try{const {error}=await sb.auth.signOut();if(error)throw error;$('close').click()}catch(err){$('authFeedback').textContent=err.message||'退出失败'}};return}
if(!sb){modal('登录暂不可用','<p class="notice">认证服务未加载，请检查网络或联系管理员。</p>');return}
modal('账号注册 / 登录','<form class="form" id="authForm"><div class="right" style="flex-wrap:wrap"><button type="button" id="signup" class="btn outline">注册</button><button type="button" id="signin" class="btn">登录</button><button type="button" id="reset" class="btn outline">找回密码</button></div><label>邮箱<input type="email" name="email" autocomplete="email" required></label><label id="passwordLabel">密码<input type="password" name="password" minlength="8" autocomplete="current-password" required></label><p id="authFeedback" role="status" aria-live="polite" class="notice hidden"></p><button type="submit" id="authSubmit" class="btn" style="width:100%">登录</button></form>');
const form=$('authForm'),msg=$('authFeedback'),tabs={signup:$('signup'),login:$('signin'),reset:$('reset')},submit=$('authSubmit');let mode='login',working=false;
const message=(value,error=false)=>{msg.textContent=value;msg.className='notice'+(error?' error':'')};
const choose=next=>{if(working)return;mode=next;for(const [name,button] of Object.entries(tabs)){button.className='btn'+(name===mode?'':' outline');button.setAttribute('aria-pressed',String(name===mode))}const reset=mode==='reset';$('passwordLabel').classList.toggle('hidden',reset);form.elements.password.required=!reset;form.elements.password.disabled=reset;form.elements.password.autocomplete=mode==='signup'?'new-password':'current-password';submit.textContent=mode==='signup'?'创建账号':reset?'发送重置邮件':'登录';msg.className='notice hidden';msg.textContent=''};
tabs.signup.onclick=()=>choose('signup');tabs.login.onclick=()=>choose('login');tabs.reset.onclick=()=>choose('reset');
form.onsubmit=async e=>{e.preventDefault();if(working)return;if(!form.elements.email.reportValidity())return;const email=form.elements.email.value.trim(),password=form.elements.password.value;
if(mode!=='reset'&&password.length<8){message('密码至少需要 8 位',true);return}
working=true;submit.disabled=true;for(const btn of Object.values(tabs))btn.disabled=true;
try{if(mode==='signup'){const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;message('注册请求已提交，请前往邮箱点击验证链接，然后返回登录。')}
else if(mode==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;message('如邮箱已注册，重置邮件将发送到该邮箱；点击邮件链接后设置新密码。')}
else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;message('登录成功');$('close').click()}}
catch(err){message(err.message||'操作失败，请稍后重试',true)}
finally{working=false;submit.disabled=false;for(const btn of Object.values(tabs))btn.disabled=false}};
choose('login');
};
if(sb){sb.auth.onAuthStateChange(async(_event,session)=>{if(_event==='PASSWORD_RECOVERY'){setTimeout(showPasswordUpdate,0);}const next=session?.user||null;if(next?.id!==user?.id){user=next;chosen.clear();rows=[];$('account').textContent=user?.email||'访客本地模式';$('auth').textContent=user?'账户':'登录 / 注册';try{await getRows()}catch(err){notice('云端读取失败：'+err.message,true)}}});sb.auth.getSession().then(({data})=>{if(!data.session&&!user)getRows()}).catch(()=>getRows())}else getRows();
})();
</script></body></html>
