<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵感开工 · 把收藏变成行动</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#282238;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:28px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;color:#6b48bd;font-size:22px}.pill{border-radius:99px;background:#ebe4f7;color:#6b48bd;padding:7px 12px;font-size:12px}.hero{padding:32px;margin:28px 0 22px;background:linear-gradient(110deg,#e5ddfb,#fff);border-radius:23px}h1{font-size:clamp(28px,5vw,43px);margin:0 0 12px}h2{font-size:19px}p{line-height:1.6;color:#6b6478}textarea,input,select,button{font:inherit}textarea,input,select{background:white;width:100%;border:1px solid #dcd4e9;border-radius:11px;padding:12px}textarea{min-height:110px;resize:vertical}button{cursor:pointer;border:0;border-radius:11px;background:#7153c8;color:white;padding:12px 17px;font-weight:650}button.secondary{background:white;color:#6142ac;border:1px solid #dacff2}button:disabled{opacity:.55}.panel,.entry{background:white;border:1px solid #eae4f2;border-radius:17px;padding:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{font-size:13px;color:#888096}.entry{padding:16px;margin:12px 0}.entry h3{margin:6px 0 8px;overflow-wrap:anywhere}.entry a{color:#6d4bc2;overflow-wrap:anywhere}.entry small{color:#8b8298}.tag{background:#efeafd;color:#6745ae;padding:4px 9px;border-radius:20px;font-size:12px}.steps{background:#f6f2fc;padding:12px;border-radius:12px;margin:10px 0}.steps li{margin:6px 0}.hint{padding:12px;border-radius:10px;background:#f1ebff;font-size:13px;color:#5d4b83}.danger{background:#fff2f1;color:#a53434}#cards{max-height:570px;overflow:auto}.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:140px}#status{min-height:26px;font-size:13px;color:#6545ab}.hidden{display:none}@media(max-width:740px){.layout{grid-template-columns:1fr}.hero{padding:24px}main{padding:18px 14px}}</style></head>
<body><main><header><div class="brand">✳ 灵感开工 <span class="muted">by 拾集</span></div><span class="pill">免注册 · 免安装 · 免费体验</span></header>
<section class="hero"><div class="pill" style="display:inline-block;margin-bottom:15px">不只是收藏，而是开始行动</div><h1>收藏了一百个灵感，<br>今天先实现一个。</h1><p>粘贴分享文案、视频链接或自己的想法。自动整理成主题卡片，生成可以马上执行的 3 步计划。</p></section>
<div class="layout"><section class="panel"><h2>① 把灵感丢进来</h2><label for="idea" class="muted">可以粘贴一整段分享文字（有链接或没链接都行）</label><textarea id="idea" placeholder="例：周末试试自制冰拿铁，低糖，用燕麦奶。https://example.com"></textarea><div class="row" style="margin-top:12px"><button id="make">✨ 生成行动卡</button><button class="secondary" id="review">🎯 今日推荐</button><button class="secondary" id="example">填入示例</button></div><div id="status" role="status"></div><div class="row" style="margin:10px 0"><label style="flex:1;min-width:130px">优先级<select id="newPriority"><option value="normal">普通</option><option value="high">高优先级</option><option value="low">低优先级</option></select></label><label style="flex:1;min-width:130px">截止日期<input id="newDue" type="date"></label></div><div class="hint">隐私说明：当前版本只在本机浏览器保存，不上传到服务器，也不读取其他 App 的私人收藏。行动步骤由内置规则生成，不宣称已调用大模型。</div><h2 style="margin-top:28px">② 你的行动卡</h2><div id="result" class="muted">生成后会在这里展示。</div><div class="row" style="margin-top:12px"><button class="secondary" id="challenge">开启7天挑战</button><button class="secondary" id="reflection">完成复盘</button></div><div id="extras" class="muted"></div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>我的灵感库</h2><span id="count" class="pill">0 条</span></div><div class="toolbar"><select id="view"><option value="all">全部任务</option><option value="todo">待开始</option><option value="doing">进行中</option><option value="done">已完成</option><option value="overdue">已逾期</option></select><select id="priority"><option value="">所有优先级</option><option value="high">高优先级</option><option value="normal">普通</option><option value="low">低优先级</option></select><input id="search" placeholder="搜索关键词或主题"><select id="category" style="width:auto;max-width:150px"><option value="">全部主题</option></select></div><div id="stats" class="hint" style="margin:12px 0"></div><div class="row"><button class="secondary" id="export">导出备份</button><button class="secondary" id="import">导入备份</button><input id="upload" type="file" accept=".json,application/json" class="hidden"></div><div id="cards"></div></section></div><p class="muted" style="text-align:center;margin-top:25px">灵感开工 v4 · 无需社交平台 OAuth · 已知限制：不自动抓取视频画面、字幕或私人收藏。</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),K='shiji_spark_v1';let data=[];try{const x=JSON.parse(localStorage.getItem(K)||'[]');if(Array.isArray(x))data=x}catch{}
const rules=[['学习成长',/学习|教程|知识|课程|复习|读书|英语|技能|study|tutorial/i,['确定要掌握的一个知识点','安排15分钟学习并记录要点','用自己的话复述，收藏一条实用结论']],['美食料理',/美食|食谱|做饭|厨房|咖啡|烘焙|奶茶|recipe|food/i,['列出需要的食材和工具','选择一天试做一个小份','记录口味和下次改进点']],['健身健康',/健身|运动|减脂|跑步|训练|瑜伽|fitness|workout/i,['确认适合自己的强度与条件','从可承受的短时间体验开始','记录感受，按需要调整']],['旅行探索',/旅行|旅游|城市|景点|出游|酒店|travel|trip/i,['确定目的地与预算','查证交通时间与开放信息','列出最多三个必去体验']],['创作设计',/拍摄|设计|摄影|剪辑|写作|创作|灵感|video|design/i,['选出最想模仿的一个亮点','制作15分钟粗略初稿','检查效果并做一次微调']],['工作效率',/工作|营销|运营|电商|项目|工具|自动化|效率|business|marketing/i,['写清想解决的具体问题','选一个最小可行步骤开始','记录结果并决定是否扩大']],['生活方式',/家居|收纳|生活|穿搭|装修|购物|整理|时尚/i,['确定一个最想改善的小场景','用现有资源尝试一次','保留有效做法并形成习惯']]];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const classify=text=>rules.find(r=>r[1].test(text))||['其他灵感',null,['写出真正感兴趣的部分','尝试一个10分钟以内的小行动','回顾是否值得继续投入']];
const parse=text=>{let url='';const match=text.match(/https?:\/\/[^\s<>"'，,）)]+/);if(match){try{const u=new URL(match[0]);if(['http:','https:'].includes(u.protocol))url=u.href}catch{}}const title=text.replace(url,'').replace(/https?:\/\/\S+/g,'').trim().slice(0,140)||url||'未命名灵感';const rule=classify(text);return {id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),title,url,category:rule[0],steps:specificSteps(title,rule),done:false,status:'todo',priority:$('newPriority').value,due:$('newDue').value,created:new Date().toISOString()}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data));render()}catch(e){$('status').textContent='保存失败，请导出备份或检查浏览器存储空间'}};
const specificSteps=(title,rule)=>{const topic=String(title).slice(0,48);return [rule[2][0]+'：'+topic,rule[2][1]+'（先做最小版本）',rule[2][2]+'并记录下一步'].map(x=>x.slice(0,170))};
const statusLabel={todo:'待开始',doing:'进行中',done:'已完成'},priorityLabel={high:'重要',normal:'普通',low:'稍后'};
const card=x=>'<div class="entry"><div class="row"><span class="tag">'+esc(x.category)+'</span><span class="tag">'+esc(priorityLabel[x.priority]||'普通')+'</span><small>'+esc(String(x.created||'').slice(0,10))+'</small></div><h3>'+esc(x.title)+'</h3>'+(x.url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(x.url)+'">打开原链接 ↗</a>':'')+'<p class="muted">截止：'+esc(x.due||'未设置')+'</p><ol class="steps">'+x.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>'+(Array.isArray(x.challenge)&&x.challenge.length?'<div class="steps"><b>7天挑战 · '+x.challenge.filter(d=>d.done).length+'/'+x.challenge.length+'天已完成</b>'+x.challenge.map((d,i)=>'<label style="display:flex;align-items:center;gap:8px;padding:5px 0"><input type="checkbox" style="width:18px" data-day="'+esc(x.id)+'" data-index="'+i+'" '+(d.done?'checked':'')+'><span>第'+(i+1)+'天：'+esc(d.task)+'</span></label>').join('')+'</div>':'')+(x.reflection?'<p class="hint">📝 成果复盘：'+esc(x.reflection)+'</p>':'')+'<div class="row"><select data-state="'+esc(x.id)+'" aria-label="更新进度"><option value="todo" '+((x.status||'todo')==='todo'?'selected':'')+'>待开始</option><option value="doing" '+(x.status==='doing'?'selected':'')+'>进行中</option><option value="done" '+(x.status==='done'?'selected':'')+'>已完成</option></select><button class="secondary" data-edit="'+esc(x.id)+'">编辑</button><button class="secondary" data-remove="'+esc(x.id)+'">删除</button></div></div>';
const render=()=>{$('count').textContent=data.length+' 条';const cats=[...new Set(data.map(x=>x.category))].sort();const selected=$('category').value;$('category').innerHTML='<option value="">全部主题</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('category').value=cats.includes(selected)?selected:'';const q=$('search').value.toLowerCase(),view=$('view').value,p=$('priority').value;const today=new Date().toISOString().slice(0,10);const done=data.filter(x=>x.status==='done'||x.done).length;const doing=data.filter(x=>x.status==='doing').length;const overdue=data.filter(x=>x.due&&x.due<today&&x.status!=='done'&&!x.done).length;$('stats').textContent='已完成 '+done+' · 进行中 '+doing+' · 已逾期 '+overdue+' · 完成率 '+(data.length?Math.round(100*done/data.length):0)+'%';const shown=data.filter(x=>(!$('category').value||x.category===$('category').value)&&(!p||(x.priority||'normal')===p)&&(view==='all'||(view==='overdue'?x.due&&x.due<today&&x.status!=='done'&&!x.done:(x.status||(x.done?'done':'todo'))===view))&&[x.title,x.category,x.url,...x.steps].join(' ').toLowerCase().includes(q));$('cards').innerHTML=shown.length?shown.map(card).join(''):'<p class="muted">没有匹配的行动卡。</p>'};

$('make').onclick=()=>{const text=$('idea').value.trim();if(!text){$('status').textContent='先粘贴一段内容或输入一个想法';return}if(text.length>8000){$('status').textContent='内容过长，最多 8000 字符';return}const x=parse(text);data.unshift(x);save();$('result').innerHTML=card(x);$('status').textContent='已生成并保存行动卡';$('idea').value=''};
$('example').onclick=()=>$('idea').value='小红书灵感：周末尝试一杯低糖燕麦奶冰拿铁，记录配方和口味。';
$('review').onclick=()=>{const available=data.filter(x=>x.status!=='done'&&!x.done);const rank=x=>(x.priority==='high'?4:x.priority==='normal'?2:0)+(x.due?3:0)+(x.status==='doing'?2:0);available.sort((a,b)=>rank(b)-rank(a));if(!available.length){$('extras').textContent='当前没有待执行的任务，先添加一个灵感吧。';return}const x=available[0];$('extras').innerHTML='<div class="steps"><b>今天先做这一件：</b>'+esc(x.title)+'<p>'+esc(x.steps?.[0]||'从最小行动开始')+'</p></div>'};
$('challenge').onclick=()=>{const x=data.find(x=>x.status!=='done'&&!x.done);if(!x){$('extras').textContent='先添加一个尚未完成的灵感，再开启挑战。';return}const days=['明确目标与所需资源','完成最简单的准备','开始第一次实践','回顾前3天的问题','改进一个关键环节','再次尝试并记录进展','总结成果与下一步'];x.challenge=days.map((task,i)=>({day:i+1,task,done:false}));save();$('extras').innerHTML='<div class="steps"><b>已为「'+esc(x.title)+'」创建7天挑战</b><ol>'+days.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ol></div>'};
$('reflection').onclick=()=>{const finished=data.filter(x=>x.status==='done'||x.done);if(!finished.length){$('extras').textContent='先完成一项行动，再记录复盘。';return}const x=finished[0];const answer=prompt('复盘：完成「'+x.title+'」后最大的收获是什么？',x.reflection||'');if(answer===null)return;x.reflection=answer.slice(0,1200);save();$('extras').textContent='复盘已保存到本地记录。'};
const act=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.remove||b.dataset.edit||b.dataset.reflect||b.dataset.start;if(!id)return;const x=data.find(i=>i.id===id);if(!x)return;if(b.dataset.start){const days=['明确成果与所需资源','完成基础准备','进行第一次实践','记录困难并找到解决方法','改进关键步骤','完成第二次实践并记录变化','展示成果并规划下一步'];x.challenge=days.map((task,i)=>({day:i+1,task,done:false}));save()}else if(b.dataset.reflect){const answer=prompt('记录这条灵感的行动成果或收获',x.reflection||'');if(answer!==null){x.reflection=answer.slice(0,1200);save()}}else if(b.dataset.edit){const title=prompt('修改行动卡标题',x.title);if(title===null)return;const category=prompt('修改主题分类',x.category);if(category===null)return;const due=prompt('截止日期（YYYY-MM-DD，留空为无）',x.due||'');if(due===null)return;x.title=(title.trim()||x.title).slice(0,200);x.category=(category.trim()||x.category).slice(0,50);if(!due||/^\d{4}-\d{2}-\d{2}$/.test(due))x.due=due;save()}else if(b.dataset.remove&&confirm('确认删除这条灵感？')){data=data.filter(i=>i.id!==id);save()}};
$('cards').onclick=act;$('result').onclick=act;$('cards').onchange=e=>{const dayId=e.target.dataset.day;if(dayId){const x=data.find(i=>i.id===dayId),idx=Number(e.target.dataset.index);if(x&&Array.isArray(x.challenge)&&Number.isInteger(idx)&&x.challenge[idx]){x.challenge[idx].done=e.target.checked;save()}return}const id=e.target.dataset.state;if(!id)return;const x=data.find(i=>i.id===id);if(x){x.status=e.target.value;x.done=x.status==='done';save()}};$('search').oninput=render;$('category').onchange=render;$('view').onchange=render;$('priority').onchange=render;

$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='linggan-kaigong-backup.json';link.click();URL.revokeObjectURL(link.href)};
$('import').onclick=()=>$('upload').click();$('upload').onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||a.length>2000)throw Error('备份格式不正确');const valid=a.filter(x=>x&&typeof x.title==='string'&&Array.isArray(x.steps)&&typeof x.id==='string').map(x=>({id:x.id.slice(0,100),title:x.title.slice(0,200),url:typeof x.url==='string'&&/^https?:\/\//.test(x.url)?x.url:'',category:String(x.category||'其他灵感').slice(0,50),steps:x.steps.filter(t=>typeof t==='string').slice(0,3).map(t=>t.slice(0,200)),done:Boolean(x.done),status:['todo','doing','done'].includes(x.status)?x.status:(x.done?'done':'todo'),priority:['high','normal','low'].includes(x.priority)?x.priority:'normal',reflection:typeof x.reflection==='string'?x.reflection.slice(0,1200):'',challenge:Array.isArray(x.challenge)?x.challenge.slice(0,7).filter(t=>t&&typeof t.task==='string').map(t=>({day:Number(t.day)||1,task:t.task.slice(0,150),done:Boolean(t.done)})):[],due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:'',created:String(x.created||'').slice(0,40)}));const ids=new Set(data.map(x=>x.id));for(const x of valid)if(!ids.has(x.id)){data.push(x);ids.add(x.id)}save();$('status').textContent='已导入 '+valid.length+' 条有效备份记录'}catch(err){$('status').textContent='导入失败：'+err.message}finally{e.target.value=''}};
render();
})();
</script></body></html>
